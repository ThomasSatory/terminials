[package]
name = "terminials-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "terminials_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
sha2 = "0.11"
base64 = "0.23"
regex = "1"

[dev-dependencies]
tempfile = "3"
