[package]
name = "terminials"
version = "0.1.0"
description = "Terminal Linux pour agents de code en parallèle (clone homemade de cmux)"
authors = ["ThomasSatory"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terminials_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Binaire de l'app nommé "terminials-app" (= mainBinaryName) pour éviter la collision
# avec le binaire CLI "terminials" dans le target/ partagé du workspace.
[[bin]]
name = "terminials-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
portable-pty = "0.9"
notify-rust = "4.17"
protocol = { path = "../crates/protocol" }
terminials-core = { path = "../crates/core" }
chrono = { workspace = true }
